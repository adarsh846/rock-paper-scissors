<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock ✊🏻 | Paper ✋🏻 | Scissors ✌🏻</title>

    <style>

        :root{
            /* control sizes from one place */
            --btn-size-desktop: 200px;
            --btn-size-tablet: 160px;
            --btn-size-mobile: 130px;
            --gap-desktop: 24px;
            --gap-mobile: 16px;
        }

        /* page basics */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 24px;
        }

        /* reusable circular button */
        .btns {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--btn-size-desktop);
            height: var(--btn-size-desktop);
            padding: 20px;
            background-color: lightcoral;
            border: 1px solid black;
            border-radius: 9999px;
            /* transition: border-radius .25s ease, transform .12s ease; */
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            transform: scale(1);
            transform-origin: center;
            transition: transform 0.6s ease-out, background-color 0.6s ease, border-radius .1s ease;
        }

        /* emoji scales responsively with clamp */
        .btns span {
            /* clamp(min, preferred, max) */
            font-size: clamp(2.6rem, 6vw, 4.5rem); /* adjusts with viewport */
            line-height: 1;
        }

        /* hover / active */
        .btns:hover {
            transform: scale(1.08);
            background-color: orange;
            /* border-radius: 12px;  */

        }
        
        .btns:active {
            transform: translateY(0); background-color: lightseagreen;
            /* border-radius: 12px; */
        }

        /* container: center and allow wrapping on smaller screens */
        .hand-sign-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--gap-desktop);
            flex-wrap: wrap;     /* allow wrapping on small screens */
            padding: 8px;
            max-width: 1100px;   /* keeps content readable on very large screens */
            margin: 0 auto;      /* center container in page */
            box-sizing: border-box;
        }

        .reset-btn {
            display: block;
            background-color: white;
            color: red;
            border: 1px solid red;
            border-radius: 50px;
            padding: 14px 20px;
            margin: 20px auto 0;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;

            /* Balloon animation */
            transform: scale(1);
            transform-origin: center;
            transition: transform 0.6s ease-out, background-color 0.6s ease, color 0.6s ease;
        }

        .reset-btn:hover {
            transform: scale(1.25);  /* inflates smoothly */
            background-color: red;
            color: white;
        }



        /* Tablet breakpoint */
        @media (max-width: 900px) {
            .btns {
                width: var(--btn-size-tablet);
                height: var(--btn-size-tablet);
            }
            .hand-sign-container {
                gap: 20px;
            }
        }

        /* Mobile breakpoint: stack and shrink */
        @media (max-width: 600px) {
            .btns {
                width: var(--btn-size-mobile);
                height: var(--btn-size-mobile);
            }
            .hand-sign-container {
                gap: var(--gap-mobile);
                /* optional: vertical stack centered — but flex-wrap keeps them in a row until they don't fit */
                padding: 12px;
            }

            /* optional: make header smaller on mobile */
            h3 {
                font-size: 1.1rem; text-align: center; margin-bottom: 8px;
            }
        }

        .game-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
            color: lightcoral;
            border: 10px solid gray;
            border-radius: 5px;
            padding: 14px 20px;
            margin: 20px auto 0;
            max-width: 500px;
            height: 100px;
            text-align: center;
            /* cursor: pointer; */
            font-size: 1rem;
        }



        .js-display-score {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: lightseagreen;
            border: 1px solid lightseagreen;
            border-radius: 50px;
            padding: 14px 20px;
            margin: 20px auto 0;
            max-width: 300px;
            height: 50px;
            /* cursor: pointer; */
            font-size: 1rem;
        }

        



        /* Blast animation */
        .blast {
            animation: pop 350ms ease-out forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(1.2); /* small pre-pop stretch */
                opacity: 1;
            }
            50% {
                transform: scale(1.6); /* expanding balloon */
                opacity: 0.6;
            }
            100% {
                transform: scale(0);   /* POP! disappears */
                opacity: 0;
            }
        }

        /* Grow-back animation */
        .grow-back {
            animation: growBack 500ms ease-out forwards;
        }

        @keyframes growBack {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


    </style>


</head>
<body>
    

    <h3 style="text-align: center;">Rock ✊🏻 | Paper ✋🏻 | Scissors ✌🏻</h3>

    <div class="hand-sign-container">

        <button class="btns" 
        onclick="
            playerMovement('Rock ✊🏻');
        ">

            <span>
                ✊🏻
            </span>
            
        </button>

        <button class="btns"
        onclick="
            playerMovement('Paper ✋🏻');
        ">

            <span>
                ✋🏻
            </span> 

        </button>

        <button class="btns"
        onclick="
            playerMovement('Scissors ✌🏻');
        ">

            <span>
                ✌🏻
            </span>

        </button>

    </div>

    <p class="game-screen">Game Screen</p>

    <p class="js-display-score"></p>
    


    <button class="reset-btn" id="blastBtn"
    onclick="
        resetScore();
        updateScoreElement();
        // alert (`Score Reset Ho Gya!\n\nWins: ${score.win} | Loses: ${score.lose} | Ties: ${score.tie}`);
    ">

        <span>
            Reset Score!
        </span>

    </button>



    <script>

        let result = '';
        // let playerMove = '';
        // let computerMove = '';


        let score = JSON.parse(localStorage.getItem('score'));

        if (score === null) {
            score = {
                win: 0,
                lose: 0,
                tie: 0
            }
        }
        
        updateScoreElement();


        // Function to compare Player's move with Computer's move.

        function playerMovement(playerMove) {

            computerMove = pickComputerMove(); // Calling Computer's Move Function: pickComputerMove in a Variable: computerMove.

            if (playerMove === 'Rock ✊🏻') {

                if (computerMove === 'Rock ✊🏻') {
                    result = 'Tie Ho Gya Yaar!'
                }

                else if (computerMove === 'Paper ✋🏻') {
                    result = 'Arey! Ping High Ho Gya Tha! Esliye Haar Gya!'
                }

                else {
                    result = 'Winner Winner Chicken Dinner!'
                };
                
            }

            else if (playerMove === 'Paper ✋🏻') {

                if (computerMove === 'Paper ✋🏻') {
                    result = 'Tie Ho Gya Yaar!'
                }

                else if (computerMove === 'Scissors ✌🏻') {
                    result = 'Arey! Ping High Ho Gya Tha! Esliye Haar Gya!'
                }

                else {
                    result = 'Winner Winner Chicken Dinner!'
                };
            }

            else if (playerMove === 'Scissors ✌🏻') {
                if (computerMove === 'Scissors ✌🏻') {
                    result = 'Tie Ho Gya Yaar!'
                }

                else if (computerMove === 'Rock ✊🏻') {
                    result = 'Arey! Ping High Ho Gya Tha! Esliye Haar Gya!'
                }

                else {
                    result = 'Winner Winner Chicken Dinner!'
                };
            }
                

            if (result === 'Winner Winner Chicken Dinner!') {
                score.win += 1;
            }

            else if (result === 'Arey! Ping High Ho Gya Tha! Esliye Haar Gya!') {
                score.lose += 1;
            }

            else if (result === 'Tie Ho Gya Yaar!') {
                score.tie += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            // localStorage.setItem('gameplayEvent', gameplayEvent());

        
            updateScoreElement();
            gameplayEvent(playerMove, computerMove, result);

            // function displayFinalResultAndScore() {
            //     return `You Picked ${playerMove}. Computer Picked ${computerMove}.\n\n${result}\n\nWins: ${score.win} | Loses: ${score.lose} | Ties: ${score.tie}`;
            // }


            // alert(displayFinalResultAndScore());



        }

        // Computer Moves Calculation (Generates Random Number between 1-2-3)

        function gameplayEvent(playerMove, computerMove, result) {
            document.querySelector('.game-screen').innerHTML =
                `You: ${playerMove}<br>Computer: ${computerMove} <br><br>${result}`;
        }

        function updateScoreElement() {
            document.querySelector('.js-display-score')
                .innerHTML = `Wins: ${score.win} | Loses: ${score.lose} | Ties: ${score.tie}`;
        }

        function pickComputerMove() {

            randomNumber = Math.floor(Math.random() * 3) + 1;

            let computerMove = '';

            if (randomNumber === 1) {
                computerMove = 'Rock ✊🏻'
            }
            else if (randomNumber === 2) {
                computerMove = 'Paper ✋🏻'
            }
            else if (randomNumber === 3) {
                computerMove = 'Scissors ✌🏻'
            };

            return computerMove;
        }


        function resetScore() {
            document.querySelector('.game-screen')
                .innerHTML = 'Score Reset Ho Gya!<br><br>Play Again!'
            return score.win = 0, score.lose = 0, score.tie = 0;
        }



        // experiment

        const btn = document.getElementById("blastBtn");

        btn.addEventListener("click", () => {
            // Trigger blast animation
            btn.classList.remove("grow-back");
            btn.classList.add("blast");
            btn.style.pointerEvents = "none";

            // After blast finishes, reappear
            setTimeout(() => {
                btn.classList.remove("blast");
                btn.classList.add("grow-back");
                btn.style.pointerEvents = "auto";
            }, 400); // slightly more than pop animation length
        });



        
    </script>

</body>
</html>
